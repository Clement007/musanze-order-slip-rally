<!DOCTYPE html>
<html>
<head>
    <title>Musanze Market Order</title>
</head>
<body>

<h2>Musanze Market Order</h2>

<form action="process.php" method="post">

    <label>Customer Name:</label><br>
    <input type="text" name="customerName" required><br><br>

    <label>Customer Phone:</label><br>
    <input type="tel" name="customerPhone" required><br><br>

    <label>Product:</label><br>
    <select name="product" required>
        <option value="">Select a product</option>
        <option value="product1">Product 1 (1000 RWF)</option>
        <option value="product2">Product 2 (2000 RWF)</option>
        <option value="product3">Product 3 (3000 RWF)</option>
    </select><br><br>

    <label>Quantity:</label><br>
    <input type="number" name="quantity" min="1" required><br><br>

    <input type="submit" value="Submit Order">

</form>

</body>
</html>
